<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Einkaufen – Im Geschäft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF5F8; --surface:#fff; --ink:#223A4D; --muted:#657B8D; --line:#D9E6ED;
  --sea:#3C8DAD; --sea-soft:#DCEEF5; --sea-deep:#2A6B87;
  --sun:#F2B94B; --sun-soft:#FFF1CF; --sun-deep:#8A6410;
  --mint:#47AE8A; --mint-soft:#DCF3EA; --mint-deep:#2E8A6B;
  --coral:#E3705F; --coral-soft:#FCE4DF; --coral-deep:#C2503F;
  --shadow:0 10px 28px -14px rgba(34,58,77,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:700; color:var(--ink); background:var(--bg);
  min-height:100dvh; display:flex; flex-direction:column;
}
.bg{position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(900px 520px at 6% -8%, #DCEFF7 0%, transparent 62%),
    radial-gradient(760px 460px at 104% 104%, #FFF3D6 0%, transparent 60%),
    var(--bg);}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--sea); outline-offset:3px}

/* ---------- Kopfzeile ---------- */
.top{display:flex; align-items:center; gap:16px; padding:14px clamp(14px,3vw,32px)}
.brand{display:flex; align-items:center; gap:8px; font-weight:900; font-size:1.1rem; color:var(--sea-deep); white-space:nowrap}
.progress{flex:1; height:8px; background:#D6E6EE; border-radius:99px; overflow:hidden}
#bar{display:block; height:100%; width:0; background:var(--sea); border-radius:99px; transition:width .4s ease}
.count{color:var(--muted); font-size:.9rem; min-width:3.4em; text-align:right}
.tools{display:flex; gap:8px}
.tool{display:flex; flex-direction:column; align-items:center; gap:2px; width:76px; padding:6px 4px 5px;
  background:#fff; color:var(--sea-deep); border:2px solid #BFE0EE; border-radius:16px; cursor:pointer;
  font-size:.7rem; font-weight:800; line-height:1.1}
.tool svg{width:26px; height:26px}
.tool .slash{display:none}
.tool.off{background:#E7EDF1; color:#8B9CA9; border-color:#D5DEE4}
.tool.off .slash{display:inline}

/* ---------- Bühne ---------- */
#stage{flex:1; display:flex; justify-content:center; align-items:center; padding:6px clamp(14px,3vw,32px) 14px}
.slide{width:min(980px,100%); animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{font-size:clamp(1.7rem,3.4vw,2.5rem); font-weight:900; margin:0 0 6px; text-align:center; letter-spacing:-.01em}
h2{margin:0}
.lead{color:var(--muted); text-align:center; margin:0 0 22px; font-size:1.1rem}
.hint{color:var(--muted); font-size:.95rem; margin:8px 0}
.c{text-align:center}

/* ---------- Fußzeile ---------- */
.nav{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px clamp(14px,3vw,32px) 22px}
.btn{background:var(--sea-deep); color:#fff; border:0; border-radius:16px; padding:14px 26px; font-weight:900; font-size:1.05rem;
  cursor:pointer; box-shadow:0 5px 0 #1D5066; display:inline-flex; align-items:center; gap:8px; transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #1D5066}
.btn.ghost{background:#fff; color:var(--sea-deep); border:2px solid #CFE0E8; box-shadow:0 5px 0 #CFE0E8}
.btn.ghost:active{box-shadow:0 1px 0 #CFE0E8}
.btn:disabled{opacity:.4; cursor:default}
.btn.big{font-size:1.3rem; padding:18px 40px}
.btn .spk{width:22px; height:22px}

/* ---------- Titelseite ---------- */
.hero{text-align:center}
.hero h1{font-size:clamp(2.8rem,9vw,5.2rem); margin:6px 0 0}
.hero .lead{font-size:1.4rem; margin-bottom:30px}
.parade{display:flex; justify-content:center; gap:clamp(8px,2.2vw,24px); font-size:clamp(2.6rem,8vw,4.6rem)}
.parade span{display:inline-block; animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3) translateY(20px); opacity:0}to{transform:none; opacity:1}}

/* ---------- Wörter-Karten ---------- */
.grid6{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.pcard{position:relative; background:#fff; border:2px solid var(--line); border-radius:24px; padding:18px 10px 14px;
  text-align:center; cursor:pointer; box-shadow:var(--shadow); transition:transform .15s, border-color .15s}
.pcard:hover{transform:translateY(-3px); border-color:var(--sea)}
.pcard .em{display:block; font-size:clamp(2.6rem,6vw,3.8rem); line-height:1.15}
.pcard .wd{display:block; font-size:1.35rem; font-weight:900; margin-top:6px}
.art-m{color:var(--sea-deep)} .art-f{color:var(--coral-deep)} .art-n{color:var(--mint-deep)}
.pcard.done::after{content:'✓'; position:absolute; top:10px; right:12px; width:26px; height:26px; border-radius:50%;
  background:var(--mint); color:#fff; display:grid; place-items:center; font-size:.9rem}
.counter{text-align:center; color:var(--muted); margin-top:14px}

/* ---------- Rollen ---------- */
.roles{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.role{border-radius:28px; padding:28px 20px; text-align:center; box-shadow:var(--shadow)}
.role.v{background:var(--sun-soft)} .role.k{background:var(--sea-soft)}
.role .av{font-size:4.2rem}
.role h2{font-size:1.9rem; margin:6px 0 4px}
.role p{margin:0; font-size:1.2rem}

/* ---------- Sprechblasen ---------- */
.row{display:flex; align-items:flex-end; gap:12px; margin:12px 0}
.row.k{flex-direction:row-reverse}
.av{font-size:2.4rem; flex:none}
.bubble{border:0; font-weight:800; font-size:clamp(1.1rem,2.4vw,1.5rem); padding:14px 20px; border-radius:22px;
  cursor:pointer; text-align:left; display:inline-flex; gap:12px; align-items:center; color:var(--ink); box-shadow:var(--shadow)}
.bubble.v{background:var(--sun-soft); border-bottom-left-radius:6px}
.bubble.k{background:var(--sea-soft); border-bottom-right-radius:6px}
.bubble .spk{width:22px; height:22px; flex:none; color:var(--sea-deep)}
.speaking{outline:3px solid var(--sea); outline-offset:2px}
.vb{color:var(--sea-deep); background:linear-gradient(transparent 62%, rgba(71,174,138,.38) 62%)}
.slot{color:var(--coral-deep); border-bottom:3px dashed var(--coral); padding:0 4px}
.pop{animation:pop2 .35s ease}
@keyframes pop2{0%{transform:scale(.97)}50%{transform:scale(1.03)}100%{transform:scale(1)}}

.cue{font-size:2.6rem; background:#fff; border:2px solid var(--line); border-radius:22px; padding:8px 18px; letter-spacing:.1em}
.sayrow{display:flex; align-items:center; justify-content:space-between; gap:14px; margin:16px 0; flex-wrap:wrap}
.note{display:inline-block; background:var(--mint-soft); color:var(--mint-deep); border-radius:99px; padding:8px 18px; font-weight:900}

/* ---------- Bauen ---------- */
.frames{display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:18px}
.frame{width:min(100%,640px); justify-content:space-between; font-size:clamp(1.3rem,3vw,1.9rem)}
.chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.chip{background:#fff; border:2px solid var(--line); border-radius:99px; padding:10px 18px; font-size:1.15rem; font-weight:800; cursor:pointer}
.chip span{font-size:1.5rem; margin-right:4px}
.chip:hover{border-color:var(--sea)}
.chip.on{background:var(--sea-soft); border-color:var(--sea)}

/* ---------- Regal ---------- */
.shelf{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; background:#fff; border:2px solid var(--line); border-radius:28px;
  padding:18px; box-shadow:var(--shadow); margin-bottom:18px}
.tile{position:relative; background:var(--bg); border-radius:20px; padding:20px 8px 12px; text-align:center; transition:background .2s, outline-color .2s; outline:3px solid transparent}
.tile .em{font-size:clamp(2.4rem,6vw,3.6rem)}
.tile.hit{background:var(--mint-soft); outline-color:var(--mint)}
.tile .said{position:absolute; top:-12px; left:50%; transform:translateX(-50%); white-space:nowrap; background:var(--sun); color:#4A3400;
  border-radius:99px; padding:3px 14px; font-weight:900; font-size:1rem; display:none}
.tile.hit .said{display:block; animation:pop .35s both}
.qs{display:flex; flex-wrap:wrap; justify-content:center; gap:12px}

/* ---------- Dialog ---------- */
.dlg{min-height:120px; margin-bottom:12px}
.dlg .row{animation:fade .3s ease}

/* ---------- Preise ---------- */
.ptag{display:inline-flex; align-items:center; gap:10px; background:var(--sun-soft); border:2px dashed var(--sun); border-radius:14px;
  padding:6px 16px 6px 12px; font-weight:900; font-size:1.35rem; color:var(--sun-deep); white-space:nowrap}
.ptag::before{content:''; width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--sun)}
.pitem{text-align:center; margin-bottom:18px}
.pitem .big{font-size:clamp(4rem,12vw,6.5rem); line-height:1.1}
.rules{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:22px}
.rule{background:var(--sun-soft); border-radius:20px; padding:14px 22px; font-size:1.2rem; display:flex; align-items:center; gap:12px}
.rule b{font-size:1.6rem; color:var(--sea-deep)}
.pair{margin-bottom:22px}
.veil{filter:blur(7px); opacity:.7; transition:filter .5s, opacity .5s}
.veil.open{filter:none; opacity:1}
.swap{display:flex; align-items:center; justify-content:center; gap:clamp(12px,4vw,40px); margin-bottom:22px}
.sw{background:#fff; border:2px solid var(--line); border-radius:26px; padding:18px 24px; text-align:center; box-shadow:var(--shadow)}
.sw .em{display:block; font-size:clamp(3rem,9vw,5rem); margin-bottom:6px}
.swap .arrow{font-size:2.6rem; color:var(--sea)}

/* ---------- Quiz ---------- */
.quiz{background:#fff; border-radius:28px; padding:26px; box-shadow:var(--shadow); border:2px solid var(--line)}
.qhead{color:var(--muted); font-size:.95rem; margin-bottom:12px}
.qprompt{text-align:center; margin-bottom:20px}
.qvis{font-size:3.2rem; margin-bottom:6px}
.qtext{font-size:clamp(1.5rem,3.4vw,2.2rem); font-weight:900}
.gap{display:inline-block; min-width:3.6em; border-bottom:4px dashed var(--coral); color:var(--coral-deep)}
.gap.filled{border-bottom-color:var(--mint); color:var(--mint-deep)}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px}
.opt{font-weight:900; font-size:1.5rem; padding:18px 10px; border-radius:18px; border:3px solid var(--line); background:#fff; cursor:pointer}
.opt.emo{font-size:3rem}
.opt:hover{border-color:var(--sea); background:var(--sea-soft)}
.opt.right{background:var(--mint-soft); border-color:var(--mint)}
.opt.wrong{background:var(--coral-soft); border-color:var(--coral); animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qfoot{display:flex; justify-content:flex-end; margin-top:18px; min-height:56px}
.done{text-align:center; padding:14px 0}
.done .stars{font-size:2.4rem; letter-spacing:.15em}
.done h2{font-size:2rem; margin:8px 0}

/* ---------- Weg ---------- */
.plan{position:relative; height:340px; background:#fff; border:2px solid var(--line); border-radius:28px; box-shadow:var(--shadow); margin-bottom:18px;
  background-image:linear-gradient(#F0F6F9 2px,transparent 2px),linear-gradient(90deg,#F0F6F9 2px,transparent 2px); background-size:40px 40px}
.spot{position:absolute; transform:translate(-50%,-50%); text-align:center; font-size:2.8rem; background:var(--sea-soft); border-radius:20px; padding:10px 16px}
.spot span{display:block; font-size:.95rem; font-weight:800}
.spot.arrived{background:var(--mint-soft); outline:3px solid var(--mint)}
.walker{position:absolute; transform:translate(-50%,-50%); font-size:2.6rem; transition:left .9s ease, top .9s ease}
.dirs{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}

/* ---------- Rollenspiel ---------- */
.duo{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px}
.panel{border-radius:26px; padding:20px; box-shadow:var(--shadow); border:2px solid var(--line)}
.panel.kd{background:linear-gradient(#fff,#F1F9FD); border-color:#BFE0EE}
.panel.vk{background:#FFFBEF; border-color:#F6DFA6}
.panel h2{font-size:1.4rem; margin-bottom:10px}
.li{display:flex; align-items:center; gap:12px; font-size:1.25rem; padding:8px 0; border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.li .em{font-size:1.8rem}
.li .ptag{margin-left:auto; font-size:1rem; padding:3px 12px 3px 10px}
.phrases{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px}
.phrases .chip{font-size:1rem; padding:8px 14px}
.center{display:flex; justify-content:center; margin:14px 0}

/* ---------- Ende ---------- */
.end{text-align:center}
.end .big{font-size:5rem}
.end h1{font-size:clamp(2.4rem,7vw,4rem)}
.confetti i{position:fixed; top:-20px; width:10px; height:14px; border-radius:2px; animation:fall 3.2s linear forwards; pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:700px){
  .roles,.duo{grid-template-columns:1fr}
  .brand span{display:none}
  .tool{width:64px; font-size:.62rem}
  .plan{height:300px}
}
@media (max-width:520px){ .grid6,.shelf{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="brand">🛒 <span>Einkaufen</span></div>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  <div class="count" id="count"></div>
  <div class="tools">
    <button class="tool" id="tVoice" type="button" aria-pressed="true" title="Aussprache an oder aus" aria-label="Aussprache an oder aus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="currentColor"/><path d="M7 10h10M7 13h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><line class="slash" x1="3" y1="3" x2="21" y2="21" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line class="slash" x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Aussprache</span>
    </button>
    <button class="tool" id="tFx" type="button" aria-pressed="true" title="Effekte an oder aus" aria-label="Effekte an oder aus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z" fill="currentColor"/><path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><line class="slash" x1="3" y1="3" x2="21" y2="21" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line class="slash" x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Effekte</span>
    </button>
  </div>
</header>

<main id="stage"></main>

<footer class="nav">
  <button class="btn ghost" id="prev" type="button">Zurück</button>
  <button class="btn" id="next" type="button">Weiter</button>
</footer>

<script>
(function(){
'use strict';

/* ================= Hilfsfunktionen ================= */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const SPK = '<svg class="spk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

/* ================= Töne ================= */
let voiceOn = true, fxOn = true;
try{ const v=localStorage.getItem('einkaufen.voice'), f=localStorage.getItem('einkaufen.fx'); if(v==='0')voiceOn=false; if(f==='0')fxOn=false; }catch(e){}

let deVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const v = speechSynthesis.getVoices();
  deVoice = v.find(x=>/^de[-_]DE/i.test(x.lang)) || v.find(x=>/^de/i.test(x.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function say(text, cb){
  if(!voiceOn || !('speechSynthesis' in window)){ if(cb) setTimeout(cb,600); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; if(deVoice) u.voice = deVoice; u.rate = .85;
  if(cb){ u.onend = cb; u.onerror = e=>{ if(e.error!=='interrupted' && e.error!=='canceled') cb(); }; }
  speechSynthesis.speak(u);
}

let actx = null;
function ac(){
  if(!actx){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return null; actx = new C(); }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function tone(freq,t0,dur,type,vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.16,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const FX = {
  click(){ tone(520,0,.07,'sine',.07); },
  right(){ tone(660,0,.14,'triangle',.18); tone(880,.12,.24,'triangle',.18); },
  wrong(){ tone(230,0,.16,'sawtooth',.08); tone(170,.14,.26,'sawtooth',.08); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.28,'triangle',.17)); tone(1319,.55,.5,'triangle',.15); }
};
function playFx(n){ if(!fxOn) return; try{ FX[n](); }catch(e){} }

function setTool(btn,on){
  btn.classList.toggle('off',!on);
  btn.setAttribute('aria-pressed', on?'true':'false');
}
setTool($('#tVoice'),voiceOn); setTool($('#tFx'),fxOn);
$('#tVoice').addEventListener('click',()=>{
  voiceOn=!voiceOn; setTool($('#tVoice'),voiceOn);
  try{localStorage.setItem('einkaufen.voice',voiceOn?'1':'0');}catch(e){}
  if(!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  else say('Hallo!');
});
$('#tFx').addEventListener('click',()=>{
  fxOn=!fxOn; setTool($('#tFx'),fxOn);
  try{localStorage.setItem('einkaufen.fx',fxOn?'1':'0');}catch(e){}
  if(fxOn) FX.right();
});

function pulse(el){ el.classList.add('speaking'); setTimeout(()=>el.classList.remove('speaking'),1200); }
document.addEventListener('click',e=>{
  const s = e.target.closest('[data-say]');
  if(s){ playFx('click'); say(s.dataset.say); pulse(s); }
  if(e.target.closest('[data-next]')) go(cur+1);
  if(e.target.closest('[data-home]')) go(0);
});

/* ================= Daten ================= */
const P = [
  {id:'milch',  e:'🥛', a:'die', w:'Milch',  price:'1,20 €'},
  {id:'brot',   e:'🍞', a:'das', w:'Brot',   price:'2,00 €'},
  {id:'kaese',  e:'🧀', a:'der', w:'Käse',   price:'2,50 €'},
  {id:'aepfel', e:'🍎', a:'die', w:'Äpfel',  price:'3,00 €', pl:true},
  {id:'reis',   e:'🍚', a:'der', w:'Reis',   price:'1,80 €'},
  {id:'wasser', e:'💧', a:'das', w:'Wasser', price:'0,80 €'}
];
const byId = id => P.find(p=>p.id===id);
const artCls = a => a==='der'?'art-m':a==='die'?'art-f':'art-n';

/* ================= Quiz-Motor ================= */
function quiz(root, qs){
  const box = document.createElement('div'); box.className='quiz'; root.appendChild(box);
  let i=0, first=0;
  function show(){
    const q = qs[i]; let tried=false, solved=false;
    box.innerHTML =
      `<div class="qhead">Frage ${i+1} von ${qs.length}</div>
       <div class="qprompt">
         ${q.visual?`<div class="qvis">${q.visual}</div>`:''}
         ${q.text?`<div class="qtext">${q.text}</div>`:''}
         ${q.listen?`<button class="btn play" type="button">${SPK} Anhören</button><p class="hint c"></p>`:''}
       </div>
       <div class="opts"></div><div class="qfoot"></div>`;
    const opts=$('.opts',box), foot=$('.qfoot',box);
    q.options.forEach(o=>{
      const b=document.createElement('button'); b.type='button';
      b.className='opt '+(o.cls||q.cls||''); b.innerHTML=o.label;
      b.addEventListener('click',()=>{
        if(solved || b.classList.contains('wrong')) return;
        if(o.v===q.correct){
          solved=true; b.classList.add('right'); playFx('right'); if(!tried) first++;
          const g=$('.gap',box); if(g){ g.textContent=o.label; g.classList.add('filled'); }
          if(q.say) setTimeout(()=>say(q.say),450);
          const n=document.createElement('button'); n.type='button'; n.className='btn';
          n.textContent = (i===qs.length-1) ? 'Fertig' : 'Weiter';
          n.addEventListener('click',()=>{ playFx('click'); if(i<qs.length-1){ i++; show(); } else finish(); });
          foot.appendChild(n);
        } else { tried=true; b.classList.add('wrong'); playFx('wrong'); }
      });
      opts.appendChild(b);
    });
    if(q.listen){
      const hint=$('.hint',box);
      const play=()=>{ if(!voiceOn){ hint.textContent='Schalte die Aussprache ein.'; return; } hint.textContent=''; say(q.listen); };
      $('.play',box).addEventListener('click',play);
      setTimeout(play,300);
    }
  }
  function finish(){
    box.innerHTML =
      `<div class="done">
         <div class="stars">${'⭐'.repeat(first)}${'☆'.repeat(qs.length-first)}</div>
         <h2>${first===qs.length?'Perfekt!':'Gut gemacht!'}</h2>
         <p class="lead">${first} von ${qs.length} richtig beim ersten Mal.</p>
         <button class="btn ghost" type="button">Nochmal</button>
       </div>`;
    playFx('win');
    $('.btn',box).addEventListener('click',()=>{ i=0; first=0; show(); });
  }
  show();
}

/* ================= Navigation ================= */
let cur = 0;
function go(n){
  n = Math.max(0, Math.min(S.length-1, n));
  cur = n;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  const stage = $('#stage'); stage.innerHTML='';
  const sec = document.createElement('section'); sec.className='slide';
  const s = S[cur];
  if(s.t){ sec.innerHTML = `<h1>${s.t}</h1><p class="lead">${s.l||''}</p>`; }
  const body = document.createElement('div'); sec.appendChild(body); stage.appendChild(sec);
  s.r(s.t ? body : sec);
  $('#bar').style.width = ((cur+1)/S.length*100)+'%';
  $('#count').textContent = (cur+1)+' / '+S.length;
  $('#prev').disabled = cur===0;
  $('#next').disabled = cur===S.length-1;
  window.scrollTo(0,0);
  try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){}
}
$('#prev').addEventListener('click',()=>{ playFx('click'); go(cur-1); });
$('#next').addEventListener('click',()=>{ playFx('click'); go(cur+1); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});
let tx=null;
document.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',e=>{
  if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>80){ go(cur+(dx<0?1:-1)); }
},{passive:true});

const h = parseInt((location.hash||'').slice(1),10);
go(isNaN(h)?0:h-1);
})();
